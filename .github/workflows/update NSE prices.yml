name: Update NSE prices

on:
  schedule:
    # 10:15 UTC = 3:45 PM IST, ~15 min after NSE close, most days enough
    # time for Yahoo Finance to have the day's close. Runs Mon-Fri only.
    - cron: '15 10 * * 1-5'
  workflow_dispatch: {}   # lets you trigger a run by hand from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch prices
        run: python fetch_prices.py

      - name: Commit updated data
        run: |
          git config user.name "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add data/prices.json data/indices.json
          git diff --cached --quiet && echo "No changes" || git commit -m "Update NSE prices $(date -u +%Y-%m-%d)"
          git push
